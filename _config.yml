title: Digitalis
description: ARM64-to-x86_64 binary translation for Android
url: https://digitalisx64.github.io

# No theme. Every page here carries its own stylesheet, so GitHub Pages' default
# (jekyll-theme-primer) would only add an unreferenced assets/css/style.css to
# the deployed site — one that does not pass CSS validation. The github-pages
# gem honours an explicit null here; leaving the key out silently opts in.
theme: null

# Default byline for posts. A post overrides it by setting the same two keys
# under `author:` in its own front matter.
author:
  name: utzcoz
  url: https://github.com/utzcoz

# Posts are written as Markdown in _posts/ and rendered by _layouts/post.html.
# A new post needs nothing but a file named _posts/YYYY-MM-DD-slug.md with a
# `title:` in its front matter; the layout, the date and the URL follow from that.
permalink: /posts/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - serve.sh
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
