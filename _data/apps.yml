# Third-party apps verified on the Digitalis emulator, rendered by apps.html.
#
# To add an app, append an entry to the matching list below. Nothing else needs
# editing: the page builds its tables, counts and filters from this file, and a
# status with no entries drops out of the page entirely.
#
#   name     display name — always quoted, some contain a colon
#   package  Android application id
#   stack    verified/partial: the engine or framework, e.g. 'Unity (IL2CPP)'
#   reason   blocked: why it does not run in this environment
#   notes    optional prose shown after the stack; inline HTML is allowed
#
# Statuses:
#   verified  launches and runs with no crash
#   partial   passes the launch gate, not yet verified deep in-app
#   blocked   not fixable in the translator (anti-emulator, GMS, or an app bug)


