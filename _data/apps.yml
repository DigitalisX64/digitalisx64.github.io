blocked:
  - name: 'Clash of Clans'
    package: com.supercell.clashofclans
    reason: >-
      Anti-emulator integrity gate, confirmed not a translator fault. 17.360.42
      (original Supercell-signed splits) aborts ~1&nbsp;s into startup, before
      any UI, with an encrypted pure-Java exception (<code>pacl.az</code>, thrown
      from an obfuscated <code>pacl.*</code> SDK on the host ART after an
      <code>E&nbsp;Report</code> telemetry line) and SIGKILLs its own process.
      The stack carries no native or translator frame, ~8,800 region
      translations succeed first with no <code>Undefined arm64</code> and no
      signal, and the abort is byte-identical under <code>berberis.mode
      interpret-only</code> — so no JIT miscompile is involved. The environment
      it reads is saturated with host-side emulator markers
      (<code>ro.kernel.qemu=1</code>, <code>ro.hardware=ranchu</code>,
      <code>ro.build.characteristics=emulator</code>) that any anti-emulator
      check trips on regardless of translation; other anti-tamper apps (Honkai,
      Baidu, WhatsApp) run on the same image. 18.400.22 (Supercell-signed
      universal APK) behaves identically — the same encrypted pure-Java
      exception under a renamed obfuscated package (<code>vxvyhom.a</code> from
      <code>vxvyhom.W.run</code>), again after an <code>E&nbsp;Report</code>
      line, again with no native frame, and again byte-identical against a
      translator build from before the current optimizer work
    tested_on: [16, 17]
  - name: 'Into the Dead 2'
    package: com.pikpok.dr2.play
    reason: >-
      Needs Play Asset Delivery. 1.85.0 (the full arm64 bundle) installs and holds
      its title screen with no crash, while its asset-pack sync fails with
      <code>AssetPackException: -11</code> (<code>PLAY_STORE_NOT_FOUND</code>): the
      game's content downloads through the Play Store, which the GMS-less emulator
      image does not ship.
    tested_on: [16, 17]
  - name: 'eBay'
    package: com.ebay.mobile
    reason: >-
      eBay's backend rejects the device. 6.272.0.2 runs and renders its own home
      and sign-in screens, but device registration fails with <em>Invalid
      Request</em> (<code>errorId=485320</code>) while the Play Integrity API
      reports no Play Store, so no content loads. The vendor-signed x86_64 build
      running natively on the same emulator, with no translation at all, fails
      identically.
    tested_on: [16, 17]
