    stack: 'Gecko'
  - name: 'Baidu Maps'
    package: com.baidu.BaiduMap
    stack: 'Native map engine + GL'
    notes: >-
      launches and renders cleanly (no crash across an 18-launch + 10-minute
      soak). A <code>:SandBoxProcess</code> sub-process JNI abort (the sofire
      anti-tamper SDK passed a null class to <code>GetStaticFieldID</code>, which
      the emulator's CheckJNI turned into a process-fatal abort) is fixed under
      translation — Berberis returns a null field id instead of aborting, matching
      production behavior
  - name: 'NetEase Cloud Music'
    package: com.netease.cloudmusic
    stack: 'React Native + Hermes'
  - name: 'Brave Browser'
    package: com.brave.browser
    stack: 'Chromium'
  - name: 'Helium Browser'
    package: io.github.jqssun.helium
    stack: 'Chromium 149'
    notes: >-
      renders content-rich pages on the default GPU path. Its GPU process used to
      crash-loop calling an advertised-but-NULL ANGLE extension proc
      (<code>glGetIntegervRobustANGLE</code>) until the browser aborted on a
      GPU-channel timeout &mdash; fixed by the translator's
      <code>eglGetProcAddress</code> override, which wraps the ~80 ANGLE/CHROMIUM
      extension procs the generated marshallers couldn't so the
      <em>advertised-implies-non-NULL</em> contract holds. Needs an emulator
      carrying the gfxstream <code>VK_EXT_memory_budget</code> fix: without it the
      emulator process itself aborts when the GPU process queries the memory
      budget, which is a host-decoder limitation rather than a translation one
      &mdash; the same page runs and renders under
      <code>-gpu swiftshader_indirect</code> on an unfixed binary
  - name: 'Amap'
    package: com.autonavi.minimap
    stack: 'Native map engine + GL'
  - name: 'Facebook'
    package: com.facebook.katana
    stack: 'Native (Litho/Yoga, SoLoader)'
  - name: 'CoolApk'
    package: com.coolapk.market
    stack: 'Native'
    notes: >-
      launches and loads its feed. It used to sit on &ldquo;Loading failed&rdquo;
      with no crash and no error in the log, because the heavy JIT tier&rsquo;s
      CPU-state cache was keyed on a register slot without regard for access
      width: a 64-bit read of a vector register zeroes the upper half of its host
      XMM, and forwarding that to a later 128-bit read of the same register fed
      zeroes into the app&rsquo;s bcrypt key schedule, producing a wrong hash and
      a rejected auth token. The cache now records each mapping&rsquo;s width and
      register class
  - name: 'WeChat'
    package: com.tencent.mm
    stack: 'Native (Tinker/XWeb)'
  - name: 'Tencent Map'
    package: com.tencent.map
    stack: 'Native map engine + GL'
  - name: 'AliExpress'
    package: com.alibaba.aliexpresshd
    stack: 'Native + system WebView + SecurityGuard'
  - name: 'Douyin'
    package: com.ss.android.ugc.aweme
    stack: 'Native UI (ByteDance Lynx) + WebView hardware-accel draw functor'
    notes: >-
      launches and survives. Its Lynx native UI library called
      <code>android::RegisterDrawFunctor</code> during WebView initialization — a
      symbol in the WebView hardware-accel support library
      <code>libwebviewchromium_plat_support</code> that used to abort the process
      as an uncovered proxy trampoline (<code>Bad '&lt;sym&gt;' call</code>). It
      is now covered in-surface and forwarded to the host WebView support library,
      with a valid host <code>JNIEnv</code> obtained by attaching the calling
      worker thread to the host VM
  - name: 'Kuaishou'
    package: com.smile.gifmaker
    notes: >-
      Launches and plays video. Four classes of fault were fixed under
      translation: fdsan fd-ownership aborts and a SIGALRM deadman-timer watchdog
      from its integrity SDK; the media player's calls into
      <code>libgui.so</code> — a private SurfaceFlinger system library with no
      guest copy — now satisfied by a minimal guest-only stub plus the host-call
      redirect; and a feed that rendered <em>solid green</em> because
      <code>ANativeWindow_lock</code> reports a zero stride for planar-YUV
      windows, so the player addressed every row of the frame at row 0 and posted
      an all-zero buffer (Y=U=V=0 is exactly RGB(0,135,0)). A proxy override now
      supplies the stride the pixel format mandates
  - name: 'Honkai: Star Rail'
    package: com.HoYoverse.hkrpgoversea
    stack: 'Unity (IL2CPP)'
    notes: >-
      A namespace-isolation fix cleared the crash that used to block launch:
      isolated app namespaces no longer load their own copies of non-public system
      libraries, so Unity&rsquo;s global <code>operator new</code> in
      <code>libunity.so</code> can no longer interpose over a system library and
      route it into the app&rsquo;s not-yet-initialized allocator &mdash;
      previously a SIGILL on libunity&rsquo;s encrypted lazy-init path. An
      apparent residual crash after that fix turned out to be a re-signed,
      incorrectly merged APK rather than a translation fault; the publisher-signed
      universal APK runs.

partial:
  - name: 'WhatsApp'
    package: com.whatsapp
    notes: >-
      Launches, loads its native libraries cleanly, and reaches a fully usable
      EULA screen. It only crashes when <em>another Meta app is installed
      alongside it</em>: with Facebook present, WhatsApp routes from the EULA
      into Meta's cross-app account-linking flow, which tears the EULA activity
      down, and during that teardown its own dependency-injection graph builds
      the Voltron download manager on the main thread and trips its own
      "must not be called on the main thread" guard. Uninstalling the other Meta
      app makes the EULA reachable and stable again with an unchanged translator
      &mdash; a pure Java crash with no translator frame in the stack

