# The document catalogue behind /docs.html and the per-release pages. Each entry
# is a Markdown file in the digitalis repo; the link is built per release from
# the branch in _data/releases.yml, so a document is written once here and
# points at whichever branch the reader is looking at.
#
#   file      path under docs/ in the digitalis repo
#   meta      small label above the title
#   title     link text; %VERSION% is replaced with the release number
#   excerpt   prose shown under the title, inline HTML allowed
#   versions  optional: restrict to these releases (default: every release)

- file: how-it-works.md
  meta: Reference &middot; 19 sections
  title: how-it-works.md
  excerpt: >-
    The complete walkthrough, written to be searched rather than read through:
    register mapping, the translation lifecycle, NZCV flag emulation, the syscall
    path, proxy-library forwarding, and the ARM64 &rarr; x86_64
    instruction-mapping reference.

- file: integrating-digitalis.md
  meta: Integration
  title: Integrating Digitalis into an AOSP&nbsp;%VERSION% product
  excerpt: >-
    Adding ARM64 translation to your own x86_64 image &mdash; emulator or real
    device &mdash; through the stock NativeBridge seams: a manifest overlay, four
    board-config lines, and one product inherit, or a prebuilt binary bundle when
    you cannot add source projects. Ends with a verification checklist down to the
    <code>memfd:exec</code> oracle that proves translation is actually executing.

- file: RELEASE_NOTES.md
  meta: Changelog
  title: Release notes
  excerpt: >-
    Every release in one file, newest first: what was fixed, what it broke before
    it was fixed, and the verification behind each entry &mdash; host tests, both
    translator builds, the sample suite, the prebuilt-app gate and the benchmark
    sweep. Written as post-mortems rather than bullet lists, so an entry usually
    explains the failure as well as the change.

- file: benchmark-results.md
  meta: Measurements
  title: Benchmark results
  excerpt: >-
    Every workload across all three execution tiers, regenerated from a real sweep
    rather than written by hand. Cells that exceeded a 10% relative interquartile
    range are marked and must not be quoted; benchmarking.md covers the
    methodology and how to read a noisy row.

- file: unsupported-opcodes.md
  meta: Coverage
  title: Instruction coverage
  excerpt: >-
    What the translator does not implement yet, and what that costs at runtime
    &mdash; a missing JIT case falls back to the interpreter rather than failing,
    so the list is a performance map as much as a correctness one.

- file: emulator-gfxstream-deploy.md
  meta: Emulator
  title: Deploying a fixed emulator
  excerpt: >-
    The host-side graphics faults that look like translation bugs and are not:
    a Vulkan heap clamped to 2&nbsp;GB, a decoder that aborts on a newer
    <code>pNext</code> struct, a retired guest pipe that hangs every Vulkan call.
    Each entry names the symptom, the host code behind it, and whether it is still
    reachable on an ANGLE image.

- file: proxy-bad-symbol-audit.md
  meta: Proxy surface
  title: Proxy symbol audit
  excerpt: >-
    Which guest library symbols the proxy layer cannot auto-marshal, why each one
    is safe to leave uncovered, and the rule for adding a trampoline when a real
    app hits one.
  versions: [16]

- file: prebuilt-games-blank-render.md
  meta: Graphics
  title: Blank-render triage
  excerpt: >-
    How a game that launches but draws nothing gets taken apart: what the content
    heuristic measures, which blank frames turned out to be guest memory pressure
    rather than rendering, and the host-side causes found underneath the rest.
  versions: [17]
