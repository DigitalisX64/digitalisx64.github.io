<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} &mdash; Digitalis</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_newlines }}">
  {%- assign page_author = page.author | default: site.author %}
  {%- if page.date and page_author.name %}
  <meta name="author" content="{{ page_author.name }}">
  {%- endif %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon-180.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {%- include theme-head.html %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCH8R0W6KL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LCH8R0W6KL');
  </script>
</head>
<body>

  {% include nav.html %}

{{ content }}

  <!-- Footer -->
  {% include footer.html %}

  <script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
</body>
</html>
