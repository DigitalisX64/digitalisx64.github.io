<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} &mdash; Digitalis</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_newlines }}">
  {%- assign page_author = page.author | default: site.author %}
  {%- if page.date and page_author.name %}
  <meta name="author" content="{{ page_author.name }}">
  {%- endif %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon-180.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCH8R0W6KL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LCH8R0W6KL');
  </script>
</head>
<body>

{{ content }}

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p><a href="{{ '/index.html' | relative_url }}">Home</a> &middot; <a href="{{ '/docs.html' | relative_url }}">Docs</a> &middot; <a href="{{ '/blog.html' | relative_url }}">Blog</a> &middot; Apache 2.0 License &middot; <a href="https://github.com/DigitalisX64" target="_blank" rel="noopener">GitHub</a></p>
      <p>Built on AOSP Berberis framework</p>
    </div>
  </footer>

</body>
</html>
