name: Verify Site

on:
  pull_request:
    branches: [android-latest-release]
  push:
    branches: [android-latest-release]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in index.html style.css serve.sh _config.yml; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present"

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check every post rendered and is linked from the blog index
        run: |
          test -f _site/blog.html || { echo "Missing: _site/blog.html"; exit 1; }
          shopt -s nullglob
          count=0
          for md in _posts/*.md; do
            slug="$(basename "$md" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')"
            test -f "_site/posts/$slug/index.html" || { echo "Not rendered: $md"; exit 1; }
            grep -q "/posts/$slug/" _site/blog.html || { echo "Not linked from blog.html: $md"; exit 1; }
            count=$((count + 1))
          done
          echo "$count post(s) rendered and linked"

      - name: Validate HTML
        run: |
          pip install html5validator
          html5validator --root _site --also-check-css

      - name: Verify serve.sh is executable
        run: test -x serve.sh

      - name: Test local preview starts
        run: |
          ./serve.sh 8080 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | head -1 | grep -q '<!DOCTYPE html>'
          echo "Preview server works"
          kill %1
