name: Verify Site

on:
  pull_request:
    branches: [android-latest-release]
  push:
    branches: [android-latest-release]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in index.html style.css serve.sh lint.sh _config.yml _data/apps.yml; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present"

      - name: Install linters
        run: pip install yamllint pymarkdownlnt pyyaml html5validator

      - name: Lint sources
        run: ./lint.sh

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check every post rendered and is linked from the blog index
        run: |
          test -f _site/blog.html || { echo "Missing: _site/blog.html"; exit 1; }
          shopt -s nullglob
          count=0
          for md in _posts/*.md; do
            slug="$(basename "$md" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')"
            test -f "_site/posts/$slug/index.html" || { echo "Not rendered: $md"; exit 1; }
            grep -q "/posts/$slug/" _site/blog.html || { echo "Not linked from blog.html: $md"; exit 1; }
            count=$((count + 1))
          done
          echo "$count post(s) rendered and linked"

      - name: Check every app in the data file reached the page
        run: |
          test -f _site/apps.html || { echo "Missing: _site/apps.html"; exit 1; }
          python3 - <<'PY'
          import re, sys, yaml
          data = yaml.safe_load(open('_data/apps.yml'))
          page = open('_site/apps.html').read()
          missing = [a['package']
                     for apps in data.values() if apps
                     for a in apps
                     if f"<code>{a['package']}</code>" not in page]
          if missing:
              sys.exit('Not rendered on apps.html: ' + ', '.join(missing))
          total = sum(len(a or []) for a in data.values())
          rendered = len(re.findall(r'<tr data-status=', page))
          if rendered != total:
              sys.exit(f'{total} apps in data, {rendered} rows on the page')
          print(f'{total} apps rendered')
          PY

      # HTML only. The bundled CSS checker predates inset, subgrid,
      # scrollbar-width, text-wrap, SVG geometry properties and variable-font
      # weights that are not multiples of 100 -- all valid, all used here -- so
      # --also-check-css would fail on correct stylesheets. HTML validation
      # earns its place: it is what caught a <style> element left in <body>.
      - name: Validate HTML
        run: html5validator --root _site

      - name: Verify scripts are executable
        run: |
          test -x serve.sh
          test -x lint.sh

      - name: Test local preview starts
        run: |
          ./serve.sh 8080 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | head -1 | grep -q '<!DOCTYPE html>'
          echo "Preview server works"
          kill %1
